<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <h1>Create Account </h1>
    <p>Join us and start your journey</p>
    <form id="signupForm">
        <div class="input-box">
            <label>Full Name</label>
            <input id="signupName" type="text" placeholder="Enter your name" required>
        </div>
        <div class="input-box">
            <label>Email</label>
            <input id="signupEmail" type="email" placeholder="Enter your email" required>
        </div>
        <div class="input-box">
            <label>Password</label>
            <input id="signupPassword" type="password" placeholder="Enter your password" required>
        </div>
        <div class="input-box">
            <label>Confirm Password</label>
            <input id="signupConfirmPassword" type="password" placeholder="Confirm your password" required>
        </div>
        <button type="submit">Sign Up</button>
        <a href="login.html">Already have an account? Login</a>
        
    </form>
    <script src="./login.js"></script>
  </div>
</body>
</html>
