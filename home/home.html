<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodie - Premium Restaurant</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <div class="logo">
        <i class="fas fa-utensils"></i> Foodie
      </div>
      
      <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input type="text" class="search-box" placeholder="Search delicious meals...">
      </div>
      
      <nav class="nav-menu">
        <div class="nav-item" data-action="home">
          <i class="fas fa-home"></i> Home
        </div>
        <div class="nav-item" data-action="categories">
          <i class="fas fa-th-large"></i> Categories
        </div>
        <div class="nav-item" data-action="ingredients">
          <i class="fas fa-leaf"></i> Ingredients
        </div>
        <div class="nav-item" data-action="areas">
          <i class="fas fa-map-marker-alt"></i> Areas
        </div>
      </nav>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="content">
    <!-- <div class="section-header">
      <h1 class="section-title">Featured Dishes</h1>
    </div> -->
    <div class="meals-grid"></div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container">
      <div class="footer-col">
        <h3>About Us</h3>
        <p>Foodie brings you delicious meals from all around the world.</p>
      </div>
      <div class="footer-col">
        <h3>Quick Links</h3>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Categories</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3>Follow Us</h3>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="home.js"></script>
  <script>
    // Navbar actions


    // Load home on page start
    window.addEventListener("load", () => {
      getAllMeals();
    });
  </script>
</body>
</html>
